<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">UltraSplitter processing model</title>
  <desc id="desc">An irregular asset sheet passes through deterministic scanning, host-led semantic planning, source-pixel routing, primary visual review, and delivery as named images, layered PSD pages, and a provenance manifest. Incomplete subjects may enter an approval-gated reconstruction path. Transparent variants use a separate optional review gate.</desc>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e9e8e1" stroke-width="0.7"/>
    </pattern>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#fff"/>
      <path d="M0 0H6V6H0ZM6 6H12V12H6Z" fill="#d7d9d8"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#16877d"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b56b18"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #57706f; }
      .headline { font-size: 30px; font-weight: 500; fill: #172c35; }
      .subtitle { font-size: 14px; fill: #586b70; }
      .stage { font-size: 12px; font-weight: 750; letter-spacing: 1.1px; fill: #52666b; }
      .card-title { font-size: 15px; font-weight: 700; fill: #182f38; }
      .copy { font-size: 12px; fill: #607176; }
      .micro { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #74858a; }
      .panel-title { font-size: 12px; font-weight: 750; letter-spacing: 1.5px; fill: #53666b; }
      .panel-copy { font-size: 12px; fill: #52666b; }
      .card { fill: #fffefa; stroke: #d9ddd8; stroke-width: 1.2; }
      .wire { fill: none; stroke: #87969a; stroke-width: 1.7; marker-end: url(#arrow); }
      .wire-teal { fill: none; stroke: #16877d; stroke-width: 1.8; marker-end: url(#arrow-teal); }
      .wire-amber { fill: none; stroke: #b56b18; stroke-width: 1.7; stroke-dasharray: 5 5; marker-end: url(#arrow-amber); }
      .flowline { fill: none; stroke: #16877d; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1 13; animation: flow 2.8s linear infinite; }
      .flowline-amber { fill: none; stroke: #d28b37; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1 12; animation: flow 3.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      @media (prefers-reduced-motion: reduce) {
        .flowline, .flowline-amber { animation: none; }
      }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#f7f7f2"/>
  <rect width="1440" height="1120" fill="url(#paper-grid)" opacity="0.44"/>

  <text x="56" y="48" class="sans eyebrow">ULTRASPLITTER / PROCESSING MODEL</text>
  <text x="56" y="91" class="serif headline">From mixed sheet to traceable delivery</text>
  <text x="56" y="121" class="sans subtitle">Semantic scope by a multimodal host · source pixels by deterministic tools · reconstruction only with approval</text>
  <path d="M56 145H1384" stroke="#d7dcd7" stroke-width="1"/>
  <text x="1384" y="48" text-anchor="end" class="sans micro">SYSTEMS VIEW / 01</text>

  <!-- Primary pipeline -->
  <g class="sans">
    <rect x="56" y="180" width="198" height="250" rx="8" class="card"/>
    <rect x="282" y="180" width="198" height="250" rx="8" class="card"/>
    <rect x="508" y="180" width="198" height="250" rx="8" class="card"/>
    <rect x="734" y="180" width="198" height="250" rx="8" class="card"/>
    <rect x="960" y="180" width="198" height="250" rx="8" class="card"/>
    <rect x="1186" y="180" width="198" height="250" rx="8" class="card"/>

    <!-- 00 / source sheet -->
        <g stroke-linejoin="round" stroke-width="1.4">
      <rect x="103" y="230" width="100" height="72" rx="4" fill="#fffefa" stroke="#b8c4bf"/>
      <path d="M103 241H203" stroke="#d9ddd8"/>
      <circle cx="111" cy="235.5" r="1.5" fill="#d28b37"/><circle cx="117" cy="235.5" r="1.5" fill="#16877d"/><circle cx="123" cy="235.5" r="1.5" fill="#8b79a9"/>
      <path d="M113 276L116 254L125 247L137 251L141 265L134 278Z" fill="#d0e5de" stroke="#7faaa0"/>
      <rect x="148" y="248" width="25" height="22" rx="3" fill="#cfdae8" stroke="#91a3b8"/>
      <path d="M153 264L159 256L164 261L168 255L171 264Z" fill="#fffefa" stroke="#91a3b8"/>
      <path d="M176 276L181 259L190 256L196 262L193 278Z" fill="#ead6bf" stroke="#c6a879"/>
      <circle cx="184" cy="264" r="2" fill="#c6a879"/>
    </g>
    <text x="76" y="329" class="stage">00 / INPUT</text>
    <text x="76" y="354" class="card-title">Irregular asset sheet</text>
    <text x="76" y="379" class="copy">mixed scale · uneven spacing</text>
    <text x="76" y="399" class="copy">source pixels stay authoritative</text>

    <!-- 01 / deterministic scan -->
        <g stroke-linejoin="round" stroke-width="1.4">
      <rect x="330" y="232" width="100" height="68" rx="3" fill="#fffefa" stroke="#9eb2b4"/>
      <path d="M338 242H422M338 290H422" stroke="#d5dfde" stroke-width="1"/>
      <rect x="340" y="246" width="29" height="25" rx="2" fill="#d0e5de" fill-opacity=".55" stroke="#16877d" stroke-dasharray="4 3"/>
      <rect x="376" y="245" width="38" height="39" rx="2" fill="#cfdae8" fill-opacity=".45" stroke="#678b8d" stroke-dasharray="4 3"/>
      <rect x="390" y="250" width="17" height="17" rx="1" fill="#ead6bf" fill-opacity=".75" stroke="#b56b18" stroke-dasharray="3 2"/>
      <path d="M340 242V246M336 246H340M414 241H418V245" fill="none" stroke="#16877d" stroke-width="1.8"/>
    </g>
    <text x="302" y="329" class="stage">01 / SCAN</text>
    <text x="302" y="354" class="card-title">Deterministic regions</text>
    <text x="302" y="379" class="copy">panels or simple backgrounds</text>
    <text x="302" y="399" class="copy">exact oriented-source coordinates</text>

    <!-- 02 / host semantic plan -->
        <g stroke-linejoin="round" stroke-width="1.4">
      <rect x="558" y="230" width="96" height="72" rx="4" fill="#fffefa" stroke="#a99cbd"/>
      <path d="M578 230V237H634V230" fill="#d8d0e5" stroke="#a99cbd"/>
      <rect x="568" y="246" width="14" height="12" rx="2" fill="#eae6f2" stroke="#8c7ba7"/>
      <path d="M588 249H640M588 254H627" stroke="#8c7ba7"/>
      <rect x="568" y="263" width="14" height="12" rx="2" fill="#deeeea" stroke="#83aaa0"/>
      <path d="M588 266H640M588 271H630" stroke="#83aaa0"/>
      <rect x="568" y="280" width="14" height="12" rx="2" fill="#f5ead5" stroke="#c9b995"/>
      <path d="M588 283H640M588 288H621" stroke="#b56b18"/>
    </g>
    <text x="528" y="329" class="stage">02 / PLAN</text>
    <text x="528" y="354" class="card-title">Semantic inventory</text>
    <text x="528" y="379" class="copy">host groups stable region IDs</text>
    <text x="528" y="399" class="copy">clarify ambiguous scope with user</text>

    <!-- 03 / apply and route -->
        <g stroke-linejoin="round" stroke-width="1.5" fill="none">
      <rect x="780" y="249" width="34" height="31" rx="3" fill="#deeeea" stroke="#83aaa0"/>
      <path d="M787 256H807M787 262H803M787 268H800" stroke="#16877d"/>
      <path d="M814 264H827M827 264V240H842M827 264H842M827 264V288H842" stroke="#16877d"/>
      <rect x="843" y="232" width="37" height="16" rx="3" fill="#fffefa" stroke="#83aaa0"/>
      <rect x="843" y="256" width="37" height="16" rx="3" fill="#fffefa" stroke="#83aaa0"/>
      <rect x="843" y="280" width="37" height="16" rx="3" fill="#fbf3e6" stroke="#b56b18"/>
      <path d="M849 237H874M849 261H874M849 285H867" stroke="#678b8d"/>
      <circle cx="875" cy="288" r="2" fill="#b56b18" stroke="none"/>
    </g>
    <text x="754" y="329" class="stage">03 / APPLY + ROUTE</text>
    <text x="754" y="354" class="card-title">Source-preserving paths</text>
    <text x="754" y="379" class="copy">crop · composite · approved repair</text>
    <text x="754" y="399" class="copy">missing pixels require approval</text>

    <!-- 04 / primary review -->
        <g stroke-linejoin="round" stroke-width="1.4">
      <rect x="1017" y="230" width="82" height="72" rx="4" fill="#fffefa" stroke="#93aaa6"/>
      <path d="M1034 230V237H1082V230" fill="#cfddda" stroke="#93aaa6"/>
      <rect x="1027" y="247" width="10" height="10" rx="2" fill="#deeeea" stroke="#16877d"/>
      <path d="M1029 252L1032 255L1036 249M1043 250H1088" fill="none" stroke="#16877d"/>
      <rect x="1027" y="263" width="10" height="10" rx="2" fill="#deeeea" stroke="#16877d"/>
      <path d="M1029 268L1032 271L1036 265M1043 266H1088" fill="none" stroke="#16877d"/>
      <rect x="1027" y="279" width="10" height="10" rx="2" fill="#fffefa" stroke="#93aaa6"/>
      <path d="M1043 282H1075" stroke="#93aaa6"/>
      <circle cx="1084" cy="286" r="9" fill="#e4eceb" stroke="#688581"/>
      <path d="M1090 293L1096 299" stroke="#688581" stroke-width="2"/>
    </g>
    <text x="980" y="329" class="stage">04 / REVIEW</text>
    <text x="980" y="354" class="card-title">Primary visual gate</text>
    <text x="980" y="379" class="copy">compare inventory and every asset</text>
    <text x="980" y="399" class="copy">only an explicit pass proceeds</text>

    <!-- 05 / outputs -->
        <g stroke-linejoin="round" stroke-width="1.4">
      <rect x="1240" y="236" width="46" height="60" rx="3" fill="#fffefa" stroke="#97ad97"/>
      <path d="M1247 276L1257 263L1264 270L1272 258L1280 276Z" fill="#d1e0d0" stroke="#78977b"/>
      <circle cx="1273" cy="249" r="3" fill="#d9a15b"/>
      <text x="1247" y="290" font-size="7" font-weight="700" fill="#52666b">PNG</text>
      <rect x="1300" y="232" width="48" height="64" rx="3" fill="#fffefa" stroke="#97ad97"/>
      <path d="M1307 246H1341M1307 253H1335M1307 260H1341M1307 267H1335M1307 274H1341" stroke="#83aaa0" stroke-width="2"/>
      <text x="1307" y="289" font-size="7" font-weight="700" fill="#52666b">PSD</text>
    </g>
    <text x="1202" y="329" class="stage">05 / DELIVER</text>
    <text x="1202" y="354" class="card-title">Images + layered PSD</text>
    <text x="1202" y="379" class="copy">numbered pages when canvas is full</text>
    <text x="1202" y="399" class="copy">manifest records paths and provenance</text>
  </g>

  <!-- Animated mainline: static arrows remain visible when motion is disabled. -->
  <g>
    <path d="M254 304H282M480 304H508M706 304H734M932 304H960M1158 304H1186" class="wire"/>
    <path d="M254 304H282M480 304H508M706 304H734M932 304H960M1158 304H1186" class="flowline"/>
  </g>

  <!-- Approval-gated repair branch -->
  <rect x="56" y="492" width="820" height="264" rx="8" fill="#fbf8f1" stroke="#e2d6c2" stroke-width="1.2"/>
  <text x="80" y="526" class="sans panel-title">CONDITIONAL REPAIR / ONLY FOR APPROVED, IDENTITY-GROUNDED SUBJECTS</text>
  <text x="80" y="548" class="sans copy">Reconstruction is inferred content; it returns to the same primary review gate.</text>
  <g class="sans">
    <rect x="80" y="579" width="220" height="132" rx="5" fill="#fffefa" stroke="#d9c7a8"/>
    <rect x="342" y="579" width="220" height="132" rx="5" fill="#fffefa" stroke="#d9c7a8"/>
    <rect x="604" y="579" width="220" height="132" rx="5" fill="#fffefa" stroke="#d9c7a8"/>
    <text x="98" y="606" class="micro" fill="#9a651e">A / APPROVAL</text>
    <text x="98" y="635" class="card-title">Show scope + cost</text>
    <text x="98" y="660" class="panel-copy">User approves the exact</text>
    <text x="98" y="678" class="panel-copy">repair group before generation.</text>
    <text x="360" y="606" class="micro" fill="#9a651e">B / GENERATE</text>
    <text x="360" y="635" class="card-title">One constrained grid</text>
    <text x="360" y="660" class="panel-copy">One regular grid per conflict</text>
    <text x="360" y="678" class="panel-copy">group; generated pixels labeled.</text>
    <text x="622" y="606" class="micro" fill="#9a651e">C / INGEST</text>
    <text x="622" y="635" class="card-title">Validate + re-split</text>
    <text x="622" y="660" class="panel-copy">Deterministic checks, then</text>
    <text x="622" y="678" class="panel-copy">return to primary review.</text>
  </g>
  <path d="M300 646H342M562 646H604" class="wire-amber"/>
  <path d="M300 646H342M562 646H604" class="flowline-amber"/>
  <path d="M833 430V466H470V579" class="wire-amber"/>
  <path d="M833 430V466H470V579" class="flowline-amber"/>
  <text x="525" y="461" class="sans micro" fill="#9a651e">INCOMPLETE / CLIPPED</text>
  <path d="M824 646H910V452H1059V430" class="wire-teal"/>
  <path d="M824 646H910V452H1059V430" class="flowline"/>

  <!-- Optional alpha review after primary review -->
  <rect x="932" y="492" width="452" height="264" rx="8" fill="#f3f5f1" stroke="#d2dcd5" stroke-width="1.2"/>
  <text x="956" y="526" class="sans panel-title">OPTIONAL TRANSPARENT VARIANT REVIEW</text>
  <text x="956" y="548" class="sans copy">Separate gate after primary assets pass.</text>
  <path d="M1059 430V492" class="wire"/>
  <text x="1074" y="468" class="sans micro">OPTIONAL</text>
  <g class="sans">
    <rect x="958" y="579" width="112" height="82" rx="4" fill="#fff" stroke="#cbd3ce"/>
    <rect x="1102" y="579" width="112" height="82" rx="4" fill="#171b1c" stroke="#444d4c"/>
    <rect x="1246" y="579" width="112" height="82" rx="4" fill="url(#checker)" stroke="#cbd3ce"/>
    <path d="M990 633L1013 601L1038 633Z" fill="#d9a15b" stroke="#ad7c41"/>
    <path d="M1134 633L1157 601L1182 633Z" fill="#d9a15b" stroke="#ad7c41"/>
    <path d="M1278 633L1301 601L1326 633Z" fill="#d9a15b" stroke="#ad7c41"/>
    <text x="1014" y="682" text-anchor="middle" class="micro">WHITE</text>
    <text x="1158" y="682" text-anchor="middle" class="micro">BLACK</text>
    <text x="1302" y="682" text-anchor="middle" class="micro">CHECKER</text>
    <text x="956" y="724" class="sans copy">Transparent PNGs are promoted only after their own visual pass.</text>
  </g>
  <path d="M1384 624H1406V454H1285V430" class="wire"/>

  <!-- Delivery contract -->
  <path d="M56 800H1384" stroke="#d7dcd7" stroke-width="1"/>
  <text x="56" y="832" class="sans panel-title">DELIVERY CONTRACT</text>
  <text x="56" y="860" class="sans card-title">Named images + layered PSD page set</text>
  <text x="56" y="883" class="sans copy">PSD export follows primary visual approval.</text>
  <path d="M486 824V890" stroke="#d7dcd7"/>
  <text x="520" y="832" class="sans panel-title">CANVAS LIMIT</text>
  <text x="520" y="860" class="sans card-title">30,000 px per side</text>
  <text x="520" y="883" class="sans copy">Overflow uses more PSD pages; oversized sources use native-pixel tiles.</text>
  <path d="M1010 824V890" stroke="#d7dcd7"/>
  <text x="1044" y="832" class="sans panel-title">PROVENANCE</text>
  <text x="1044" y="860" class="sans card-title">Paths, routes + review state</text>
  <text x="1044" y="883" class="sans copy">Recorded in the schema-v3 manifest.</text>

  <!-- Validation dimensions: separate deterministic, visual, and manifest gates. -->
  <rect x="56" y="912" width="1328" height="144" rx="8" fill="#f0f3ef" stroke="#d2dcd5" stroke-width="1.2"/>
  <text x="80" y="940" class="sans panel-title">VALIDATION METHODS / THREE DISTINCT EVIDENCE LAYERS</text>
  <path d="M486 956V1036M910 956V1036" stroke="#d2dcd5"/>
  <text x="80" y="972" class="sans stage">DETERMINISTIC / REPAIR GRID</text>
  <text x="80" y="995" class="sans copy">Resolution · occupied count · background consistency</text>
  <text x="80" y="1015" class="sans copy">Edge contact · safe margin · duplicate shapes</text>
  <text x="510" y="972" class="sans stage">VISUAL / ALL PRIMARY ASSETS</text>
  <text x="510" y="995" class="sans copy">Identity · pose · silhouette · color</text>
  <text x="510" y="1015" class="sans copy">Material · ornament · absence of redesign</text>
  <text x="934" y="972" class="sans stage">MANIFEST / EXPORT GATE</text>
  <text x="934" y="995" class="sans copy">Schema v3 · triage · approval · retry limit</text>
  <text x="934" y="1015" class="sans copy">Visual verdict must pass before PSD export</text>
  <text x="80" y="1040" class="sans micro">AUTOMATED CHECKS FLAG MEASURABLE DEFECTS; VISUAL REVIEW CHECKS IDENTITY; THE MANIFEST GATE CONTROLS PSD EXPORT.</text>

  <text x="56" y="1092" class="sans micro">SOURCE PIXELS</text>
  <circle cx="168" cy="1088" r="4" fill="#16877d"/>
  <text x="184" y="1092" class="sans micro">APPROVAL-GATED RECONSTRUCTION</text>
  <circle cx="399" cy="1088" r="4" fill="#b56b18"/>
  <text x="415" y="1092" class="sans micro">OPTIONAL ALPHA REVIEW</text>
  <circle cx="585" cy="1088" r="4" fill="#8b79a9"/>
</svg>
