[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasplitter"
version = "0.1.0"
description = "Content-aware image splitting contracts for multimodal coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bufan Deng"}]
keywords = ["image-processing", "computer-vision", "multimodal", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["Pillow>=10.0,<13"]

[project.urls]
Homepage = "https://github.com/PlevanTem/UltraSplitter"
Repository = "https://github.com/PlevanTem/UltraSplitter"
Issues = "https://github.com/PlevanTem/UltraSplitter/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ultrasplit = "ultrasplitter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
